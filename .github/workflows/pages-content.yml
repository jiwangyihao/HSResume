name: Deploy GitHub Pages (content)

on:
  push:
    branches:
      - content
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Set build metadata
        run: |
          echo "NUXT_PUBLIC_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "NUXT_PUBLIC_GIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "NUXT_PUBLIC_STRICT_GITHUB_STATS=1" >> $GITHUB_ENV

      # Authenticate GitHub API requests during prerender to avoid 403 rate limit exceeded.
      - name: Set GitHub API token
        run: |
          echo "NUXT_GITHUB_TOKEN=${{ github.token }}" >> $GITHUB_ENV

      - name: Generate static site
        run: pnpm generate

      - name: Ensure .nojekyll
        run: touch .output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  # deploy:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: github-pages
  #     url: ${{ steps.deployment.outputs.page_url }}
  #   steps:
  #     - name: Deploy to GitHub Pages
  #       id: deployment
  #       uses: actions/deploy-pages@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .output/public

      - name: Extract artifact
        run: |
          cd .output/public
          tar -xvf artifact.tar
          rm artifact.tar

      - name: Deploy to EdgeOne Pages
        run: npx edgeone pages deploy .output/public -n ${{ vars.EDGEONE_PROJECT_NAME }} -t ${{ secrets.EDGEONE_TOKEN }}
